version: 0.1

# Render Blueprint para desplegar los servicios de CafeTech
# Ruta sugerida en Render: render.yaml (raíz del repo)

services:
  - type: web_service
    name: cafetech-gateway
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/gateway/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: ZEEBE_URL
        value: http://zeebe:26500
      - key: ZEEBE_INSECURE_CONNECTION
        value: "true"

  - type: web_service
    name: cafetech-ms-orders
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/ms-orders/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: POSTGRES_HOST
        value: "TODO_REPLACE_WITH_DB_HOST"
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        fromSecret: POSTGRES_PASSWORD
      - key: POSTGRES_DB
        value: cafetech

  - type: web_service
    name: cafetech-ms-kitchen
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/ms-kitchen/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: POSTGRES_HOST
        value: "TODO_REPLACE_WITH_DB_HOST"
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        fromSecret: POSTGRES_PASSWORD
      - key: POSTGRES_DB
        value: cafetech

  - type: web_service
    name: cafetech-ms-notifications
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/ms-notifications/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: MONGO_URI
        fromSecret: MONGO_URI

databases:
  - name: cafetech-postgres
    type: postgresql
    plan: free
    region: frankfurt
    database: cafetech
    user: postgres
    password:
      fromSecret: POSTGRES_PASSWORD

# Notas:
# - Antes de aplicar el Blueprint en Render, crea en Render los Secrets siguientes:
#   * JWT_SECRET
#   * RABBITMQ_URL (la URL amqps de CloudAMQP)
#   * POSTGRES_PASSWORD (contraseña para la DB creada por este blueprint)
#   * MONGO_URI (si usas MongoDB Atlas)
# - Después de crear la base de datos, reemplaza los valores TODO_REPLACE_WITH_DB_HOST
#   por la "Internal Database Host" que Render provisionará, o configura las variables
#   de entorno desde la UI de cada servicio para apuntar al DB interno.